---
name: On PR

"on":
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Check fmt
        run: cargo fmt --check

  build-and-test:
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build
        run: nix develop --command make build

      - name: Test and clippy
        run: nix develop --command make test

      - name: Docker image
        run: nix develop --command make docker

  upload-coverage:
    needs: build-and-test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Generate coverage (Codecov format)
        run: nix develop --command make coverage

      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: codecov.json
          fail_ci_if_error: true

  e2e-kind:
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: helm/kind-action@v1

      - name: Build image for kind
        run: docker build -t ghcr.io/builderhub/buildkit-metrics-agent:latest .

      - name: Load image into kind
        run: kind load docker-image ghcr.io/builderhub/buildkit-metrics-agent:latest --name chart-testing

      - name: Deploy rootless + service example
        run: kubectl apply -f "examples/kubernetes/rootless+service.yaml"

      - name: Wait for buildkit pod readiness
        run: kubectl wait --for=condition=ready pod/buildkitd --timeout=180s

      - name: Port-forward services
        run: ci/on-pr/e2e-kind/port-forward.sh

      - name: Run build via buildx on remote BuildKit
        run: ci/on-pr/e2e-kind/run-build.sh

      - name: Assert metrics expose build counters
        run: python ci/on-pr/e2e-kind/assert-metrics.py

  all-green:
    if: ${{ always() }}
    needs:
      - lint
      - build-and-test
      - e2e-kind
      - upload-coverage
    runs-on: ubuntu-22.04
    steps:
      - name: Verify all required jobs passed
        run: |
          echo "lint result: ${{ needs.lint.result }}"
          echo "build-and-test result: ${{ needs.build-and-test.result }}"
          echo "e2e-kind result: ${{ needs.e2e-kind.result }}"
          echo "upload-coverage result: ${{ needs.upload-coverage.result }}"

          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::lint did not succeed"
            exit 1
          fi

          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::build-and-test did not succeed"
            exit 1
          fi

          if [[ "${{ needs.e2e-kind.result }}" != "success" ]]; then
            echo "::error::e2e-kind did not succeed"
            exit 1
          fi

          if [[ "${{ needs.upload-coverage.result }}" != "success" ]]; then
            echo "::error::upload-coverage did not succeed"
            exit 1
          fi

